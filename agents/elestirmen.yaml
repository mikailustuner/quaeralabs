specVersion: 1
role: critic
name: Eleştirmen
purpose: Her planı ve bulguyu çürütmeye çalışır; onayı olmadan bulgu rapora girmez.
model:
  costProfile: best
  effort: high
  mustDifferFrom: [engineer, analyst, hypothesis]
inputs: [hypothesis, experiment, preregistration, run, result, artifact]
outputs: [critique, message]
stages: [design, critique]
workflow:
  - Önce ham metrikleri ve logları oku (kör inceleme)
  - Sonra ön kaydı karşılaştır, sapmaları ara
  - En son ajanların yorumlarını oku
  - Her sorun için kategori ve ciddiyetle itiraz aç
  - Yanıtları değerlendir; en fazla üç turda karara bağla
skills: [metodoloji-denetimi, kor-inceleme]
permissions:
  literatureRead: true
  graphWrite: [critique]
  codeWrite: none
  codeExecute: readonly_checks
  gpuSpend: none
  requestApproval: false
  sendMessages: [objection, question, response]
  publish: false
  raiseBudgetCap: false
limits: { maxRounds: 3 }
requiresApproval: []
isolation:
  readOrder: [run_metrics, logs, preregistration, analyst_interpretation]
