specVersion: 1
role: hypothesis
name: Hipotez
purpose: Kaynaklardan ve sonuçlardan test edilebilir hipotezler ve türetilmiş hipotezler önerir.
model: { costProfile: best, effort: high }
inputs: [question, artifact, result, critique]
outputs: [hypothesis, message]
stages: [hypothesis]
workflow:
  - Soruyu ve literatür özetlerini oku
  - En fazla beş hipotez taslağı üret
  - Her birine çürütülebilirlik notu ekle; çürütülemeyeni ele
  - Eleştirmen itirazlarına en fazla üç turda yanıt ver
  - Listeye alınmak için insan onayı iste
skills: [hipotez-uretme, curutulebilirlik, yaratici-dusunme]
permissions:
  literatureRead: true
  graphWrite: [hypothesis]
  codeWrite: none
  codeExecute: none
  gpuSpend: none
  requestApproval: true
  sendMessages: [response, approval_request, question]
  publish: false
  raiseBudgetCap: false
limits: { maxItemsPerTurn: 5, maxRounds: 3 }
requiresApproval: [accept_hypothesis]
isolation: {}
