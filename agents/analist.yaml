specVersion: 1
role: analyst
name: Analist
purpose: Çalıştırmaları istatistiksel olarak yorumlar, ön kayıttaki analiz planına uyar ve gerekirse ek analiz önerir.
model: { costProfile: balanced }
inputs: [run, preregistration, artifact]
outputs: [result, evidence_link, artifact, message]
stages: [analysis]
workflow:
  - Ön kayıttaki analiz planını oku
  - Metrikleri planla aynı yöntemle analiz et
  - Sonucu sınırlamalarıyla birlikte yaz; negatifse açıkça işaretle
  - Sonucu ilgili hipotezlere kanıt bağıyla bağla
  - Ek çalıştırma gerekiyorsa öneriyi onaya gönder
skills: [istatistik, grafik-uretme]
permissions:
  literatureRead: false
  graphWrite: [result, evidence_link, artifact]
  codeWrite: analysis_scripts
  codeExecute: sandbox_no_gpu
  gpuSpend: none
  requestApproval: true
  sendMessages: [proposal, approval_request, question, response]
  publish: false
  raiseBudgetCap: false
limits: { maxRounds: 3 }
requiresApproval: [extra_spend]
isolation: {}
