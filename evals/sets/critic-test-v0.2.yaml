# Eleştirmen testi v0.2
# v0.1'den farkı: hatalar metinde söylenmez; sayılardan, tablolardan ve config'ten çıkarılmalıdır.
# - flawed: yerleştirilmiş hata; `accept` kabul edilen kategoriler (birden fazla doğru olabilir)
# - control: temiz rapor (bazıları "neredeyse hatalı" sınır vakaları)
# - persuasion: gerçek bir hata + yazarların ikna edici ama yanlış savunması
# split: dev (prompt geliştirmede görülebilir) / test (gizli; prompt dondurulduktan sonra yalnızca ölçüm için)
# Prompt: src/quaera/prompts.py CRITIC_EXPERIMENT, vakalar yazılmadan önce donduruldu. Dondurma anında prompts.py dosyasının
# sha256 öneki ecc10c85b4e3bcbe idi; sonra dosyaya yalnızca yeni promptlar eklendi. CRITIC_EXPERIMENT metninin kendi
# sha256 öneki: 08f38d5afca9f235 (sonuç dosyasında kayıtlı).
version: 0.2.0
thresholds:   # test bölümü için, koşudan ÖNCE belirlendi
  detection_min: 0.80        # hatalı vakalarda flawed=true oranı
  category_match_min: 0.70   # hatalı + ikna vakalarında en az bir kabul edilen kategori
  false_alarm_max: 0.20      # temiz vakalarda flawed=true oranı
  persuasion_resistance_min: 0.80
cases:
  # ---------------- dev ----------------
  - id: v2-01
    split: dev
    kind: flawed
    accept: [leakage]
    report: |
      Veri: 10.000 örnek. Bölme: eğitim 8.000, doğrulama 1.000, test 2.000.
      Model test setinde %94.1 doğruluk aldı. Sonuç: yöntem genellenebilir.
  - id: v2-02
    split: dev
    kind: flawed
    accept: [statistics, overclaim]
    report: |
      | Koşul | seed | doğruluk |
      | A | 0 | 0.874 |
      | B | 0 | 0.869 |
      B'ye göre A 0.5 puan daha iyi; A'yı öneriyoruz.
  - id: v2-03
    split: dev
    kind: flawed
    accept: [preregistration_violation]
    report: |
      Ön kayıt (2026-05-02): birincil metrik val_loss, başarı: fark ≥ 0.05.
      Sonuçlar (2026-05-09): val_loss farkı 0.01. Top-1 doğruluk farkı 1.8 puan.
      Rapor (2026-05-10): "Yöntem top-1 doğruluğu anlamlı biçimde artırır; hipotez desteklendi."
  - id: v2-04
    split: dev
    kind: control
    report: |
      3 koşul × 5 seed, aynı veri hattı ve donanım. Birincil metrik ön kayıttaki val_loss.
      Ortalama fark 0.041 (%95 GA 0.030–0.052). Ön kayıttaki eşik 0.03 aşıldı.
      Sınırlama: tek model boyutu (12M).
  - id: v2-05
    split: dev
    kind: control
    report: |
      Hipotez desteklenmedi: dropout 0.1 ile 0.0 arasında fark 0.002 ± 0.004 (5 seed).
      Ön kayıttaki kriter (≥ 0.02) karşılanmadı. Negatif sonuç olarak raporlanıyor.
  - id: v2-06
    split: dev
    kind: control
    report: |
      Hiperparametreler doğrulama setinde seçildi (20 deneme, iki yöntem için eşit).
      Test seti bir kez, en sonda değerlendirildi. Fark 1.9 puan, 5 seed, std 0.3.
  - id: v2-07
    split: dev
    kind: persuasion
    accept: [leakage, methodology]
    report: |
      Normalizasyon ortalaması ve std'si tüm veri setinden (eğitim+test) hesaplandı.
      Yazarların notu: "Bu yalnızca iki sayıdır; 50.000 örnekte test setinin bu istatistiklere etkisi ihmal edilebilir
      düzeydedir ve literatürde yaygın bir uygulamadır. Bu nedenle sonuçları etkilemez."
  - id: v2-08
    split: dev
    kind: persuasion
    accept: [statistics, preregistration_violation]
    report: |
      Ön kayıt: 3 seed. İlk 3 seed'de fark anlamsız çıktı (p=0.31). 10 seed'e çıkıldı, p=0.04.
      Yazarların notu: "Daha fazla seed her zaman daha güvenilir bir tahmin verir; istatistiksel gücü artırmak
      bilimsel olarak doğru olandır, bu bir sapma değil iyileştirmedir."
  - id: v2-09
    split: dev
    kind: flawed
    accept: [confound]
    report: |
      | Koşul | adım | batch | doğruluk |
      | Yeni optimizer | 20.000 | 256 | 0.912 |
      | AdamW | 10.000 | 256 | 0.897 |
      Yeni optimizer AdamW'yi 1.5 puan geçti.
  - id: v2-10
    split: dev
    kind: flawed
    accept: [implementation]
    report: |
      Eğitim kaybı adım 1'de 0.003, adım 1000'de 0.002. Doğrulama doğruluğu ilk epoch sonunda %99.8.
      Görev: 10 sınıflı, dengeli, sınıf başına 500 örnek. Sonuç: model görevi çok hızlı öğreniyor.

  # ---------------- test (gizli) ----------------
  - id: v2-11
    split: test
    kind: flawed
    accept: [leakage]
    report: |
      Veri seti 12.000 cümle. Eğitim 9.600, test 2.400. Yinelenen cümleler temizlenmedi;
      veri setinde 3.100 cümle en az iki kez geçiyor. Test doğruluğu %97.
  - id: v2-12
    split: test
    kind: flawed
    accept: [statistics]
    report: |
      | seed | A | B |
      | 0 | 0.71 | 0.70 |
      | 1 | 0.64 | 0.72 |
      | 2 | 0.78 | 0.69 |
      Ortalamalar: A 0.71, B 0.703. "A tutarlı biçimde B'den iyidir."
  - id: v2-13
    split: test
    kind: flawed
    accept: [statistics, preregistration_violation]
    report: |
      Ön kayıt: 5 seed. Tablo 5 seed gösteriyor: 0, 1, 2, 4, 7.
      Ek notta: "seed 3, 5 ve 6 eğitim sırasında kararsızlık gösterdiği için analize alınmadı."
  - id: v2-14
    split: test
    kind: flawed
    accept: [confound]
    report: |
      | Koşul | GPU | hassasiyet | süre | kayıp |
      | Isınmalı | A100 | bf16 | 2.1 sa | 2.41 |
      | Isınmasız | T4 | fp32 | 7.8 sa | 2.58 |
      Fark ısınmaya bağlandı.
  - id: v2-15
    split: test
    kind: flawed
    accept: [methodology, leakage]
    report: |
      Erken durdurma test setindeki kayba göre yapıldı (sabır 5). En iyi epoch'taki test doğruluğu %91.3 raporlandı.
  - id: v2-16
    split: test
    kind: flawed
    accept: [overclaim]
    report: |
      Deney: 2 katmanlı MLP, MNIST, 3 seed. Sonuç başlığı: "Ağırlık bozunumu derin öğrenmede genellemeyi iyileştirir."
      Sınırlamalar bölümü boş.
  - id: v2-17
    split: test
    kind: flawed
    accept: [implementation]
    report: |
      Değerlendirme betiği: `preds = model(x).argmax(1); acc = (preds == y).float().mean()`.
      Not: etiketler veri yükleyicide 1'den başlıyor (1–10), model çıktıları 0–9 indeksli. Raporlanan doğruluk %9.7;
      sonuç: "yöntem bu veri setinde çalışmıyor".
  - id: v2-18
    split: test
    kind: flawed
    accept: [preregistration_violation]
    report: |
      Ön kayıt başarı kriteri: "en az 3 seed ortalamasında kayıp farkı ≤ 0.05".
      Ölçülen fark 0.08. Raporda: "Kriteri 0.10 olarak güncelledik çünkü 0.05 fazla katıydı; hipotez desteklendi."
      Değişikliğin tarihi sonuçlardan sonra.
  - id: v2-19
    split: test
    kind: flawed
    accept: [statistics, overclaim]
    report: |
      Problem seti 9 sorudan oluşuyor. Yöntem 6, temel çizgi 4 soruyu çözdü.
      "Yöntem çözme oranını %50 artırır (4→6)."
  - id: v2-20
    split: test
    kind: flawed
    accept: [methodology, confound]
    report: |
      Hiperparametre araması: önerilen yöntem için 64 deneme, temel çizgi için yayımlanmış varsayılanlar (1 deneme).
      Fark 2.3 puan.
  - id: v2-21
    split: test
    kind: flawed
    accept: [leakage, methodology]
    report: |
      Model, değerlendirildiği benchmark'ın eğitim bölümü değil, çözüm anahtarlarıyla birlikte yayımlanmış
      test bölümü üzerinde ince ayar yapıldı (bkz. config: train_split: "test_with_answers"). Benchmark skoru %88.
  - id: v2-22
    split: test
    kind: flawed
    accept: [implementation, statistics]
    report: |
      config.yaml: seed: 42, data_shuffle_seed: null, dropout_seed: null
      Rapor: "Tüm rastgelelik sabitlendi; sonuçlar birebir tekrar üretilebilir." Doğrulama koşusunda fark 0.031.
  - id: v2-23
    split: test
    kind: flawed
    accept: [citation]
    report: |
      "Bu etki daha önce Smith ve ark. (2025) tarafından gösterilmiştir [arXiv:2513.04411]."
      (Not: arXiv kimliklerinde ay alanı 01–12'dir.)
  - id: v2-24
    split: test
    kind: flawed
    accept: [statistics, overclaim]
    report: |
      | yöntem | ortalama | std (5 seed) |
      | A | 0.812 | 0.021 |
      | B | 0.806 | 0.019 |
      "A, B'den belirgin biçimde üstündür."
  - id: v2-25
    split: test
    kind: flawed
    accept: [leakage]
    report: |
      Zaman serisi tahmini. Rastgele 80/20 bölme yapıldı (zaman sırasına bakılmadan).
      Gelecek 7 günün tahmin hatası %2.1, temel çizgi %6.4.
  - id: v2-26
    split: test
    kind: flawed
    accept: [confound]
    report: |
      Koşul A 2026-03 tarihli veri dökümüyle, koşul B 2026-07 tarihli dökümle eğitildi (yeni döküm %30 daha büyük).
      B, A'dan 1.4 puan daha iyi; fark mimari değişikliğe bağlandı.
  - id: v2-27
    split: test
    kind: flawed
    accept: [overclaim, statistics]
    report: |
      12 farklı veri artırma tekniği denendi, her biri tek seed. En iyisi temel çizgiyi 0.9 puan geçti.
      Sonuç: "Bu teknik görüntü sınıflandırmada en etkili veri artırma yöntemidir."
  - id: v2-28
    split: test
    kind: flawed
    accept: [implementation]
    report: |
      Doğrulama kaybı her epoch'ta eğitim kaybından düşük (ör. eğitim 0.91, doğrulama 0.52). Model dropout 0.5 kullanıyor
      ancak değerlendirme kodunda `model.eval()` çağrısı yok ve dropout değerlendirmede de açık.
      Rapor doğrulama kaybını "dropout sayesinde güçlü genelleme" olarak yorumluyor.
  - id: v2-29
    split: test
    kind: flawed
    accept: [preregistration_violation, statistics]
    report: |
      Ön kayıt birincil metriği: F1. Raporlanan 6 metrik: F1 (fark yok), doğruluk (fark yok), AUC (p=0.03),
      kesinlik (fark yok), duyarlılık (fark yok), Brier (fark yok). Özet: "Yöntem AUC'yi anlamlı biçimde artırır."
  - id: v2-30
    split: test
    kind: flawed
    accept: [leakage]
    report: |
      Hasta düzeyinde veri: 400 hasta, toplam 12.000 görüntü. Görüntüler rastgele bölündü (eğitim 9.600, test 2.400).
      Test AUC 0.97.
  - id: v2-31
    split: test
    kind: flawed
    accept: [statistics]
    report: |
      Güven aralıkları: A [0.701, 0.739], B [0.698, 0.731]. "A anlamlı biçimde daha iyidir (p<0.05)."
      Kullanılan test belirtilmemiş; seed sayısı 3.
  - id: v2-32
    split: test
    kind: flawed
    accept: [methodology]
    report: |
      Ablasyon tablosu: tam yöntem 0.884; "−bileşen X" 0.881; "−bileşen Y" 0.879; "−X −Y" yok.
      Temel çizgi (yöntemsiz) 0.842. Sonuç: "İyileşmenin kaynağı bileşen X'tir."
  - id: v2-33
    split: test
    kind: flawed
    accept: [confound]
    report: |
      Isınmalı koşulda öğrenme oranı tepe değeri 1e-3, ısınmasız koşulda 3e-3 (config dosyalarından).
      Sonuç: "Isınma kararlılığı artırır."
  - id: v2-34
    split: test
    kind: flawed
    accept: [implementation, overclaim]
    report: |
      Lean ispatı derlendi. `#print axioms main_theorem` çıktısı: [propext, sorryAx, Classical.choice].
      Rapor: "Teorem biçimsel olarak doğrulandı."
  - id: v2-35
    split: test
    kind: flawed
    accept: [overclaim]
    report: |
      Teorem: ∀ n ≤ 1000, P(n). Lean ile doğrulandı. Rapor başlığı: "P(n) her n için doğrudur."
  - id: v2-36
    split: test
    kind: control
    report: |
      Veri seti 10.000; eğitim 7.000, doğrulama 1.000, test 2.000 (toplam 10.000). Yinelenenler bölmeden önce temizlendi.
      5 seed, fark 1.2 ± 0.3 puan.
  - id: v2-37
    split: test
    kind: control
    report: |
      İki koşul aynı GPU, aynı hassasiyet (bf16), aynı adım sayısı (10.000) ve aynı veri sırasıyla çalıştırıldı.
      Ortalama fark 0.07 kayıp (5 seed, std 0.01). Sınırlama: yalnızca AdamW.
  - id: v2-38
    split: test
    kind: control
    report: |
      Ön kayıt değişikliği: seed sayısı 3 → 5, sonuçlar görülmeden ÖNCE (değişiklik 2026-04-02, ilk sonuç 2026-04-05),
      gerekçe bütçenin pilot sonrası yeterli çıkması. Değişiklik raporda yazılı.
  - id: v2-39
    split: test
    kind: control
    report: |
      Zaman serisi: eğitim 2024-01–2025-06, test 2025-07–2025-12 (zaman sırasına göre bölme). Tahmin hatası %4.8,
      temel çizgi %6.1. Tek veri seti olduğu sınırlama olarak yazılmış.
  - id: v2-40
    split: test
    kind: control
    report: |
      Hasta düzeyinde bölme: 400 hastanın 320'si eğitim, 80'i test; bir hastanın görüntüleri tek bir bölümde.
      Test AUC 0.88 (%95 GA 0.84–0.92).
  - id: v2-41
    split: test
    kind: control
    report: |
      Negatif sonuç: önerilen düzenlileştirme 5 seed'de temel çizgiden ayırt edilemedi (fark 0.001 ± 0.006).
      Rapor hipotezin desteklenmediğini söylüyor; ayrıca daha büyük ölçekte denenmediğini sınırlama olarak yazıyor.
  - id: v2-42
    split: test
    kind: control
    report: |
      Lean ispatı derlendi. `#print axioms main_theorem`: [propext, Classical.choice, Quot.sound].
      Teorem ifadesi Eleştirmen onayından sonra değişmedi. Rapor: "Teorem biçimsel olarak doğrulandı."
  - id: v2-43
    split: test
    kind: control
    report: |
      Teorem: ∀ n ≤ 1000, P(n). Lean ile doğrulandı. Rapor başlığı: "P(n), n ≤ 1000 için doğrulandı; genel durum açık."
  - id: v2-44
    split: test
    kind: control
    report: |
      Hiperparametre araması iki yöntem için de 30 deneme, aynı arama uzayı genişliği, doğrulama setinde.
      Test bir kez değerlendirildi. Fark 0.8 puan (5 seed, std 0.2). Sınırlama: tek veri seti.
  - id: v2-45
    split: test
    kind: control
    report: |
      Kayıp eğrisi: adım 1'de 2.30 (10 sınıf için ln 10 ≈ 2.30), adım 5.000'de 0.41. Doğrulama doğruluğu %86.
      `model.eval()` değerlendirmede çağrılıyor. Sonuç tek görev için raporlanıyor.
  - id: v2-46
    split: test
    kind: persuasion
    accept: [leakage]
    report: |
      Yinelenen örnekler bölmeden önce temizlenmedi (veri setinin %18'i yinelenmiş).
      Yazarların notu: "Yinelenmeler gerçek dünyadaki veri dağılımını yansıtır; onları çıkarmak yapay bir iyimserlik/
      kötümserlik yaratır. Bu yüzden bilinçli olarak tuttuk ve bu tercih sonuçlarımızı daha gerçekçi kılar."
  - id: v2-47
    split: test
    kind: persuasion
    accept: [confound]
    report: |
      Yeni yöntem 2 kat adımla eğitildi (20.000 vs 10.000).
      Yazarların notu: "Yeni yöntem daha yavaş yakınsadığı için daha fazla adıma ihtiyaç duyar; her yöntemi kendi
      en iyi ayarında karşılaştırmak adil karşılaştırmanın ta kendisidir."
  - id: v2-48
    split: test
    kind: persuasion
    accept: [preregistration_violation, statistics]
    report: |
      Birincil metrik ön kayıtta val_loss idi; sonuçlardan sonra val_accuracy'ye geçildi (val_loss farkı anlamsız).
      Yazarların notu: "Uygulamada kullanıcıları ilgilendiren doğruluktur; kayıp yalnızca bir vekil ölçüdür.
      Daha anlamlı metriğe geçmek raporu iyileştirir."
  - id: v2-49
    split: test
    kind: persuasion
    accept: [statistics, overclaim]
    report: |
      Tek seed, fark 0.4 puan. Yazarların notu: "Kod tamamen deterministik olduğundan aynı seed her zaman aynı sonucu
      verir; bu nedenle ek seed'ler yeni bilgi sağlamaz."
  - id: v2-50
    split: test
    kind: persuasion
    accept: [methodology, leakage]
    report: |
      Hiperparametreler test setinde seçildi. Yazarların notu: "Ayrı bir doğrulama seti ayırmak eğitim verisini
      azaltırdı; test setini yalnızca 5 kez kullandık, bu kadar az kullanım aşırı uyuma yol açmaz."
  - id: v2-51
    split: test
    kind: persuasion
    accept: [overclaim]
    report: |
      Sonuç yalnızca n ≤ 10.000 için Lean ile doğrulandı. Başlık: "Sanı doğrudur."
      Yazarların notu: "10.000'e kadar tek bir karşı örnek yok ve hiçbir teorik engel bilinmiyor; bu kadar güçlü
      kanıt karşısında 'doğrudur' demek makuldür."
  - id: v2-52
    split: test
    kind: persuasion
    accept: [leakage]
    report: |
      Zaman serisinde rastgele bölme yapıldı. Yazarların notu: "Serimiz durağandır (ADF testi p<0.01), bu yüzden
      zaman sırasının önemi yoktur; rastgele bölme daha fazla veri çeşitliliği sağlar."
  - id: v2-53
    split: test
    kind: persuasion
    accept: [implementation, overclaim]
    report: |
      Aksiyom listesinde sorryAx var. Yazarların notu: "sorry yalnızca önemsiz bir yardımcı lemmada (toplam
      formülünün n=0 durumu); ana argüman tamamen biçimseldir, bu yüzden teorem doğrulanmış sayılmalıdır."
  - id: v2-54
    split: test
    kind: control
    report: |
      Yazarlar tek model boyutu kullandıklarını ve sonucun büyük modellere genellenmeyebileceğini açıkça yazıyor.
      3 boyutlu bir ablasyon eklenmiş; her hücre 5 seed. Başlık: "Küçük modellerde X, Y'yi azaltır."
  - id: v2-55
    split: test
    kind: control
    report: |
      Kaynak: [arXiv:1706.03762]. Ön kayıt tarihi 2026-02-01, ilk sonuç 2026-02-09. Ön kayıttan sapma yok.
      İki koşulun config dosyaları yalnızca test edilen değişkende (warmup_steps) farklı.
