# "Known findings" set — selection protocol v0.1
# Goal: measure whether the agent team can rediscover a published ML finding without knowing the result.
# To prevent answering from memory, findings are chosen from papers published AFTER the knowledge cutoff
# of ALL models used, and the set is refreshed with every model update.
version: 0.1.0
selection_rules:
  - The paper must have been posted to arXiv after the knowledge cutoff of the newest model being evaluated.
  - The finding must be testable on a single GPU in under 24 hours (≤50M parameters or equivalent).
  - The paper must have open code and a pinned dataset (so the Verifier can produce the reference result).
  - The direction of the finding must be expressible in one sentence (e.g. "X lowers metric Z under condition Y").
  - At least one third of the set must consist of negative or unexpected results.
grading:
  - The agent team is given only the question and the environment; not the paper or the result.
  - "correct": the report's main finding matches the paper's direction and has passed the Verifier.
  - "incorrect": the opposite direction, or a claim that has not passed the Verifier.
  - "inconclusive": the team explicitly said the evidence is insufficient (scored better than incorrect, worse than correct).
target_size: 20
curation_status: pending   # to be filled in by the domain advisor for the Phase 0 gate
cases: []
