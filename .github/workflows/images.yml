name: Images

# Builds and publishes the Lean and ML container images (improvement plan A2, ADR 0018) to the GitHub container registry:
#   ghcr.io/<owner>/quaera-lean:<Mathlib revision>   Lean + Mathlib build cache + REPL   (docker/lean.Dockerfile)
#   ghcr.io/<owner>/quaera-ml:0.1                    Python 3.12, numpy, scipy, scikit-learn, CPU torch   (docker/ml.Dockerfile)
# Both for linux/amd64 and linux/arm64 (Apple Silicon). The names must match src/quaera/images.py.
# After the first publish, make the two packages public in the repository's package settings.
# Run by hand (Actions → Images → Run workflow) when lean/ or docker/ changes: the build takes hours under emulation and
# must not hold back the checks of an ordinary commit.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: quaera-lean
            dockerfile: docker/lean.Dockerfile
            context: lean
          - name: quaera-ml
            dockerfile: docker/ml.Dockerfile
            context: docker
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the Lean image is several GB per platform)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Tag
        id: tag
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ matrix.name }}" = quaera-lean ]; then
            tag="$(sed -n 's/^rev = "\(.*\)"/\1/p' lean/lakefile.toml | head -1)"
          else
            tag="0.1"
          fi
          echo "ref=ghcr.io/${owner}/${{ matrix.name }}:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.ref }}
