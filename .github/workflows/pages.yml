name: Pages

# Publishes the evidence package verifier (web/verify, improvement plan E3) to GitHub Pages.
# One-time setup: Settings → Pages → Source: GitHub Actions.
# Run by hand (Actions → Pages → Run workflow): a failing Pages job must not mark main red before Pages is enabled.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/verify
      - id: deployment
        uses: actions/deploy-pages@v4
