[project]
name = "quaeralabs"
version = "0.1.0"
description = "QuaeraLabs: open-source AI research team"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0",
    "rfc3339-validator>=0.1.4",
    "mcp>=2.3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "cryptography>=42",
]

[project.scripts]
quaera = "quaera.cli:main"

[project.optional-dependencies]
providers = [
    "litellm>=1.104.0",
]
# Multilingual embeddings for lab memory (hybrid bm25 + vector recall); without it recall is bm25 only.
memory = [
    "fastembed>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaera"]

# The rule files and the built web UI ship inside the wheel (quaera/resources.py finds them); build the UI first:
# cd web && npm ci && npm run build
[tool.hatch.build.targets.wheel.force-include]
"agents" = "quaera/_data/agents"
"skills" = "quaera/_data/skills"
"schemas" = "quaera/_data/schemas"
"web/dist" = "quaera/_data/web/dist"

[dependency-groups]
dev = ["pytest>=8", "numpy>=2", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not lean and not live'"
markers = ["lean: requires Lean and Mathlib to be installed", "live: makes real model calls (costs money)"]
