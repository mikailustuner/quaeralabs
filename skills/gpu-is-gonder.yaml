id: gpu-is-gonder
version: 0.1.0
description: Onaylı plan bütçesi içinde yerel GPU'ya ya da kullanıcının bulut hesabına
  iş gönderir.
domains:
- ml
tools:
- name: gpu.submit
  protocol: mcp
  server: compute
- name: gpu.status
  protocol: mcp
  server: compute
requiredPermissions:
  codeExecute: sandbox
  gpuSpend: within_approved_plan
eval: pending
